<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>나의 영화 티어리스트</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #20283a;
      background: #f5f7fb;
      font-synthesis: none;
      --ink-soft: #758096;
      --line: #e7eaf1;
      --accent: #6258d9;
      --accent-dark: #4e45bd;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 64px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px;
      color: white; background: linear-gradient(145deg, #766bef, #5147c6); font-size: 22px;
      box-shadow: 0 8px 18px #6258d92e;
    }
    .eyebrow { margin: 0 0 3px; color: var(--ink-soft); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: 19px; letter-spacing: -.04em; }
    .local-note { color: var(--ink-soft); font-size: 13px; }

    .intro { margin-bottom: 25px; }
    .intro h2 { margin: 0 0 7px; font-size: clamp(25px, 4vw, 34px); letter-spacing: -.055em; }
    .intro p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.6; }

    .add-panel {
      display: flex; align-items: end; gap: 12px; padding: 18px; margin-bottom: 20px;
      background: white; border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 5px 18px #20283a08;
    }
    .field { display: grid; flex: 1; gap: 7px; min-width: 0; }
    .field label { color: #606b80; font-size: 12px; font-weight: 700; }
    input, select {
      width: 100%; height: 44px; padding: 0 12px; color: #20283a;
      background: white; border: 1px solid #dfe3ec; border-radius: 9px; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #6258d91c; }
    .title-field, .poster-field { flex: 2; }

    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 42px; padding: 0 15px; color: #fff; background: var(--accent);
      border: 0; border-radius: 9px; font-size: 13px; font-weight: 700; white-space: nowrap;
      transition: background .15s, transform .15s;
    }
    .button:hover { background: var(--accent-dark); }
    .button:active { transform: translateY(1px); }
    .button.secondary { color: #4d46b8; background: #f0efff; }
    .button.secondary:hover { background: #e6e4ff; }
    .button.ghost { min-height: 34px; padding: 0 10px; color: #667187; background: transparent; }
    .button.ghost:hover { color: #4039a8; background: #f2f1ff; }

    .board-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 26px 0 12px; }
    .board-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.03em; }
    .board-heading span { color: var(--ink-soft); font-size: 12px; }
    .tiers { display: grid; gap: 12px; }
    .tier {
      --tier-color: #675dd7;
      display: grid; grid-template-columns: 142px minmax(0, 1fr); min-height: 112px;
      overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 3px 12px #20283a06; transition: border-color .15s, box-shadow .15s;
    }
    .tier.is-drop-target { border-color: var(--tier-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tier-color) 16%, transparent); }
    .tier-label {
      display: flex; flex-direction: column; justify-content: center; padding: 15px 17px;
      background: color-mix(in srgb, var(--tier-color) 9%, white);
      border-right: 1px solid color-mix(in srgb, var(--tier-color) 14%, white);
    }
    .tier-name { overflow-wrap: anywhere; color: var(--tier-color); font-size: 22px; font-weight: 800; letter-spacing: -.05em; }
    .tier-count { margin-top: 5px; color: #838ca0; font-size: 11px; }
    .tier-actions { display: flex; gap: 2px; margin-top: 9px; }
    .tier-actions .button { min-height: 27px; padding: 0 7px; font-size: 11px; }
    .tier-content { display: flex; align-items: center; align-content: center; flex-wrap: wrap; gap: 9px; min-width: 0; padding: 16px; }
    .empty { color: #a0a7b5; font-size: 13px; }
    .movie {
      display: flex; align-items: center; gap: 9px; min-width: 0; max-width: 100%;
      padding: 8px 9px; color: #394257; background: #f7f8fb; border: 1px solid #edf0f5;
      border-radius: 9px; font-size: 13px;
    }
    .movie-poster {
      flex: 0 0 auto; width: 42px; height: 62px; object-fit: cover;
      background: #e9ebf2; border-radius: 5px;
    }
    .movie.is-dragging { opacity: .38; }
    .drag-handle {
      flex: 0 0 auto; padding: 0; color: #a0a7b5; background: transparent; border: 0;
      font-size: 16px; line-height: 1; cursor: grab; touch-action: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .movie-title { min-width: 0; overflow-wrap: anywhere; }
    .remove-movie {
      flex: 0 0 auto; width: 22px; height: 22px; padding: 0; color: #929bad;
      background: transparent; border: 0; border-radius: 6px; font-size: 17px; line-height: 1;
    }
    .remove-movie:hover { color: #d54d66; background: #fff0f2; }
    .status { min-height: 20px; margin: 11px 2px 0; color: var(--ink-soft); font-size: 12px; }
    .status.error { color: #bd344a; }

    dialog {
      width: min(420px, calc(100% - 32px)); padding: 0; color: inherit;
      border: 0; border-radius: 16px; box-shadow: 0 20px 70px #171d2d40;
    }
    dialog::backdrop { background: #1b203080; }
    .dialog-body { padding: 22px; }
    .dialog-body h2 { margin: 0 0 17px; font-size: 19px; letter-spacing: -.04em; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    @media (max-width: 650px) {
      .page { width: min(100% - 28px, 520px); padding: 27px 0 42px; }
      .topline { align-items: flex-start; margin-bottom: 25px; }
      .local-note { max-width: 110px; text-align: right; line-height: 1.45; }
      .add-panel { align-items: stretch; flex-direction: column; gap: 12px; padding: 15px; }
      .title-field, .poster-field { flex: auto; }
      .add-panel .button { width: 100%; }
      .tier { grid-template-columns: 96px minmax(0, 1fr); min-height: 106px; }
      .tier-label { padding: 12px 10px; }
      .tier-name { font-size: 20px; }
      .tier-content { gap: 7px; padding: 11px; }
      .movie { gap: 6px; padding: 7px; font-size: 12px; }
      .board-heading { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">필름</div>
        <div>
          <p class="eyebrow">MY MOVIE COLLECTION</p>
          <h1>나의 영화 티어리스트</h1>
        </div>
      </div>
      <div class="local-note">이 브라우저에만<br>저장돼요</div>
    </header>

    <section class="intro">
      <h2>내가 본 영화, 나만의 순위로</h2>
      <p>영화를 추가할 때 포스터 주소도 넣을 수 있어요. 손잡이를 드래그해 다른 티어로 옮겨 보세요.</p>
    </section>

    <form class="add-panel" id="movieForm">
      <div class="field title-field">
        <label for="movieTitle">영화 제목</label>
        <input id="movieTitle" name="title" type="text" maxlength="100" placeholder="예: 기생충" autocomplete="off" required>
      </div>
      <div class="field poster-field">
        <label for="posterUrl">포스터 이미지 주소 (선택)</label>
        <input id="posterUrl" name="posterUrl" type="url" maxlength="2048" placeholder="https://..." autocomplete="url">
      </div>
      <div class="field">
        <label for="movieTier">추가할 티어</label>
        <select id="movieTier" name="tier"></select>
      </div>
      <button class="button" type="submit"><span aria-hidden="true">＋</span> 영화 추가</button>
    </form>

    <div class="board-heading">
      <h2>나의 티어 보드</h2>
      <button class="button secondary" id="addTierButton" type="button">＋ 티어 추가</button>
    </div>
    <div class="tiers" id="tiers" aria-label="영화 티어 목록"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <dialog id="tierDialog">
    <form class="dialog-body" id="tierForm">
      <h2 id="tierDialogTitle">티어 추가</h2>
      <div class="field">
        <label for="tierNameInput">티어 이름</label>
        <input id="tierNameInput" type="text" maxlength="24" placeholder="예: S" required>
      </div>
      <div class="dialog-actions">
        <button class="button ghost" id="cancelTierButton" type="button">취소</button>
        <button class="button" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "movie-tier-list-v1";
      const tierColors = ["#6258d9", "#d18b25", "#3b8f79", "#d25d72", "#4382bd", "#8a60b0"];
      const defaultTiers = [
        { id: "tier-s", name: "S", movies: [] },
        { id: "tier-a", name: "A", movies: [] },
        { id: "tier-b", name: "B", movies: [] },
        { id: "tier-c", name: "C", movies: [] }
      ];
      const board = document.getElementById("tiers");
      const movieForm = document.getElementById("movieForm");
      const titleInput = document.getElementById("movieTitle");
      const posterUrlInput = document.getElementById("posterUrl");
      const tierSelect = document.getElementById("movieTier");
      const status = document.getElementById("status");
      const dialog = document.getElementById("tierDialog");
      const tierForm = document.getElementById("tierForm");
      const tierNameInput = document.getElementById("tierNameInput");
      const dialogTitle = document.getElementById("tierDialogTitle");
      let dialogMode = "add";
      let editingTierId = null;
      let dragState = null;
      let state = loadState();

      function isValidState(value) {
        return Array.isArray(value) && value.length > 0 && value.every((tier) =>
          tier && typeof tier.id === "string" && typeof tier.name === "string" &&
          Array.isArray(tier.movies) && tier.movies.every((movie) =>
            movie && typeof movie.id === "string" && typeof movie.title === "string"
          )
        );
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return defaultTiers.map((tier) => ({ ...tier, movies: [] }));
          const parsed = JSON.parse(saved);
          if (isValidState(parsed)) {
            parsed.forEach((tier) => tier.movies.forEach((movie) => {
              if (typeof movie.posterUrl !== "string") movie.posterUrl = "";
            }));
            return parsed;
          }
          status.textContent = "저장된 목록을 읽을 수 없어 기본 티어로 시작했어요.";
          status.classList.add("error");
        } catch (error) {
          status.textContent = "저장된 목록을 불러오지 못했어요. 브라우저 저장 공간을 확인해 주세요.";
          status.classList.add("error");
        }
        return defaultTiers.map((tier) => ({ ...tier, movies: [] }));
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (status.classList.contains("error")) {
            status.textContent = "";
            status.classList.remove("error");
          } else {
            status.textContent = "변경 사항을 이 브라우저에 저장했어요.";
          }
        } catch (error) {
          status.textContent = "브라우저에 저장하지 못했어요. 저장 공간이나 브라우저 설정을 확인해 주세요.";
          status.classList.add("error");
        }
      }

      function makeId(prefix) {
        return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
      }

      function render() {
        tierSelect.replaceChildren();
        state.forEach((tier) => {
          const option = document.createElement("option");
          option.value = tier.id;
          option.textContent = tier.name;
          tierSelect.append(option);
        });

        board.replaceChildren();
        state.forEach((tier, index) => {
          const section = document.createElement("section");
          section.className = "tier";
          section.dataset.tierId = tier.id;
          section.style.setProperty("--tier-color", tierColors[index % tierColors.length]);

          const label = document.createElement("div");
          label.className = "tier-label";
          const name = document.createElement("div");
          name.className = "tier-name";
          name.textContent = tier.name;
          const count = document.createElement("div");
          count.className = "tier-count";
          count.textContent = tier.movies.length + "편";
          const actions = document.createElement("div");
          actions.className = "tier-actions";
          actions.append(
            createButton("이름 변경", "ghost", () => openTierDialog("rename", tier)),
            createButton("삭제", "ghost", () => deleteTier(tier.id))
          );
          label.append(name, count, actions);

          const content = document.createElement("div");
          content.className = "tier-content";
          if (tier.movies.length === 0) {
            const empty = document.createElement("span");
            empty.className = "empty";
            empty.textContent = "영화를 여기로 드래그하세요";
            content.append(empty);
          }
          tier.movies.forEach((movie) => content.append(createMovieCard(movie, tier.id)));
          section.append(label, content);
          board.append(section);
        });
      }

      function createButton(text, style, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "button " + style;
        button.textContent = text;
        button.addEventListener("click", onClick);
        return button;
      }

      function createMovieCard(movie, tierId) {
        const card = document.createElement("article");
        card.className = "movie";
        card.dataset.movieId = movie.id;
        card.dataset.tierId = tierId;

        const handle = document.createElement("button");
        handle.type = "button";
        handle.className = "drag-handle";
        handle.textContent = "⠿";
        handle.setAttribute("aria-label", movie.title + " 이동");
        handle.title = "드래그해 티어 이동";
        handle.addEventListener("pointerdown", (event) => startDrag(event, movie.id, tierId));
        handle.addEventListener("pointermove", moveDrag);
        handle.addEventListener("pointerup", finishDrag);
        handle.addEventListener("pointercancel", cancelDrag);

        const title = document.createElement("span");
        title.className = "movie-title";
        title.textContent = movie.title;
        const posterUrl = getSafePosterUrl(movie.posterUrl);
        if (posterUrl) {
          const poster = document.createElement("img");
          poster.className = "movie-poster";
          poster.src = posterUrl;
          poster.alt = movie.title + " 포스터";
          poster.loading = "lazy";
          poster.referrerPolicy = "no-referrer";
          poster.addEventListener("error", () => poster.remove(), { once: true });
          card.append(handle, poster, title);
        } else {
          card.append(handle, title);
        }
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-movie";
        remove.textContent = "×";
        remove.setAttribute("aria-label", movie.title + " 삭제");
        remove.addEventListener("click", () => removeMovie(movie.id));
        card.append(remove);
        return card;
      }

      function getSafePosterUrl(value) {
        if (typeof value !== "string" || !value.trim()) return "";
        try {
          const url = new URL(value.trim());
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
        } catch (error) {
          return "";
        }
      }

      function startDrag(event, movieId, sourceTierId) {
        if (event.button !== 0 || !event.isPrimary) return;
        event.preventDefault();
        event.currentTarget.setPointerCapture(event.pointerId);
        dragState = { movieId, sourceTierId, pointerId: event.pointerId, targetTierId: sourceTierId };
        const card = board.querySelector('[data-movie-id="' + CSS.escape(movieId) + '"]');
        if (card) card.classList.add("is-dragging");
      }

      function moveDrag(event) {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const tier = target && target.closest(".tier");
        board.querySelectorAll(".tier.is-drop-target").forEach((item) => item.classList.remove("is-drop-target"));
        if (tier) {
          dragState.targetTierId = tier.dataset.tierId;
          tier.classList.add("is-drop-target");
        } else {
          dragState.targetTierId = null;
        }
      }

      function finishDrag(event) {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        const { movieId, sourceTierId, targetTierId } = dragState;
        clearDrag();
        if (!targetTierId || sourceTierId === targetTierId) return;
        const source = state.find((tier) => tier.id === sourceTierId);
        const destination = state.find((tier) => tier.id === targetTierId);
        if (!source || !destination) return;
        const movieIndex = source.movies.findIndex((movie) => movie.id === movieId);
        if (movieIndex < 0) return;
        destination.movies.push(source.movies.splice(movieIndex, 1)[0]);
        render();
        saveState();
      }

      function cancelDrag() {
        if (dragState) clearDrag();
      }

      function clearDrag() {
        dragState = null;
        board.querySelectorAll(".is-dragging, .is-drop-target").forEach((item) => {
          item.classList.remove("is-dragging", "is-drop-target");
        });
      }

      function removeMovie(movieId) {
        state.forEach((tier) => {
          tier.movies = tier.movies.filter((movie) => movie.id !== movieId);
        });
        render();
        saveState();
      }

      function openTierDialog(mode, tier) {
        dialogMode = mode;
        editingTierId = tier ? tier.id : null;
        dialogTitle.textContent = mode === "add" ? "티어 추가" : "티어 이름 변경";
        tierNameInput.value = tier ? tier.name : "";
        dialog.showModal();
        tierNameInput.focus();
      }

      function deleteTier(tierId) {
        if (state.length === 1) {
          status.textContent = "티어는 최소 한 개가 필요해요.";
          return;
        }
        const index = state.findIndex((tier) => tier.id === tierId);
        if (index < 0) return;
        const tier = state[index];
        const destination = state[index > 0 ? index - 1 : 1];
        const message = tier.movies.length
          ? '"' + tier.name + '" 티어를 삭제하고 영화 ' + tier.movies.length + "편을 '" + destination.name + "' 티어로 옮길까요?"
          : '"' + tier.name + '" 티어를 삭제할까요?';
        if (!window.confirm(message)) return;
        destination.movies.push(...tier.movies);
        state.splice(index, 1);
        render();
        saveState();
      }

      movieForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        const posterInputValue = posterUrlInput.value.trim();
        const posterUrl = getSafePosterUrl(posterInputValue);
        const tier = state.find((item) => item.id === tierSelect.value);
        if (!title || !tier) return;
        if (posterInputValue && !posterUrl) {
          status.textContent = "포스터 주소는 http 또는 https 주소를 입력해 주세요.";
          status.classList.add("error");
          posterUrlInput.focus();
          return;
        }
        tier.movies.push({ id: makeId("movie"), title, posterUrl });
        titleInput.value = "";
        posterUrlInput.value = "";
        render();
        saveState();
        titleInput.focus();
      });

      document.getElementById("addTierButton").addEventListener("click", () => openTierDialog("add"));
      document.getElementById("cancelTierButton").addEventListener("click", () => dialog.close());
      tierForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = tierNameInput.value.trim();
        if (!name) return;
        if (dialogMode === "add") {
          state.push({ id: makeId("tier"), name, movies: [] });
        } else {
          const tier = state.find((item) => item.id === editingTierId);
          if (!tier) return;
          tier.name = name;
        }
        dialog.close();
        render();
        saveState();
      });

      render();
    })();
  </script>
</body>
</html>
